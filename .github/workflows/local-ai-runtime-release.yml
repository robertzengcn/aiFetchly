name: Local AI Runtime Release

# Downloadable embedding/voice runtimes are independent of the app installer
# release. Rebuild them when the fingerprint of Electron, runtime packages,
# worker packaging, or src/config/localAiRuntimeRelease.json changes.
# See docs/ci/local-ai-runtime-release.md.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag that will host the runtime assets (empty = committed config)
        required: false
        type: string
      runtime_version:
        description: Version embedded into runtime archive names (empty = committed config)
        required: false
        type: string
      min_app_version:
        description: Minimum app version allowed to install these runtimes (empty = committed config)
        required: false
        type: string
      publish_github_release:
        description: Create/update the GitHub Release and upload assets
        required: true
        default: true
        type: boolean
  push:
    branches:
      - master
    paths:
      - package.json
      - yarn.lock
      - src/config/localAiRuntimeRelease.json
      - src/config/localAiRuntimeRelease.ts
      - src/childprocess/embedding/**
      - src/childprocess/local-ai-runtime/**
      - src/schemas/worker/localEmbedding.ts
      - src/schemas/worker/runtimeProbe.ts
      - src/service/embedding/LocalEmbeddingModels.ts
      - vite.localEmbeddingWorker.config.mjs
      - vite.workerSsrNoExternal.mjs
      - scripts/build-local-ai-runtime.mjs
      - scripts/verify-local-ai-runtime.mjs
      - scripts/generate-local-ai-runtime-catalog.mjs
      - scripts/lib/localAiRuntime/**
      - scripts/should-rebuild-local-ai-runtime.mjs
      - .github/workflows/local-ai-runtime-release.yml

concurrency:
  group: local-ai-runtime-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  should-rebuild:
    name: Detect whether runtimes need a rebuild
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rebuild: ${{ steps.check.outputs.rebuild }}
      reason: ${{ steps.check.outputs.reason }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      runtime_version: ${{ steps.check.outputs.runtime_version }}
      min_app_version: ${{ steps.check.outputs.min_app_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Compare runtime fingerprint
        id: check
        env:
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OVERRIDE_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          OVERRIDE_RUNTIME_VERSION: ${{ github.event.inputs.runtime_version }}
          OVERRIDE_MIN_APP_VERSION: ${{ github.event.inputs.min_app_version }}
        run: |
          set -euo pipefail
          node scripts/should-rebuild-local-ai-runtime.mjs \
            --github-output "$GITHUB_OUTPUT"

      - name: Record rebuild decision
        run: |
          set -euo pipefail
          echo "rebuild=${{ steps.check.outputs.rebuild }}"
          echo "reason=${{ steps.check.outputs.reason }}"
          echo "release_tag=${{ steps.check.outputs.release_tag }}"
          echo "runtime_version=${{ steps.check.outputs.runtime_version }}"
          echo "min_app_version=${{ steps.check.outputs.min_app_version }}"
          {
            echo "## Local AI runtime rebuild"
            echo
            echo "- rebuild: \`${{ steps.check.outputs.rebuild }}\`"
            echo "- reason: ${{ steps.check.outputs.reason }}"
            echo "- release tag: \`${{ steps.check.outputs.release_tag }}\`"
            echo "- runtime version: \`${{ steps.check.outputs.runtime_version }}\`"
            echo "- min app version: \`${{ steps.check.outputs.min_app_version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-local-ai-runtimes:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }} runtimes
    needs: should-rebuild
    if: ${{ needs.should-rebuild.outputs.rebuild == 'true' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      RUNTIME_VERSION: ${{ needs.should-rebuild.outputs.runtime_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32
            arch: x64
            runner: windows-2022
          - platform: darwin
            arch: x64
            runner: macos-15-intel
          - platform: darwin
            arch: arm64
            runner: macos-15
          - platform: linux
            arch: x64
            runner: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set reproducible build timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: yarn

      - name: Set up Python for node-gyp
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Configure node-gyp Python
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$(python -c 'import sys; print(sys.executable)')"
          echo "Using Python for node-gyp: ${PYTHON_BIN}"
          python --version
          echo "PYTHON=${PYTHON_BIN}" >> "$GITHUB_ENV"
          echo "npm_config_python=${PYTHON_BIN}" >> "$GITHUB_ENV"
          echo "NODE_GYP_FORCE_PYTHON=${PYTHON_BIN}" >> "$GITHUB_ENV"

      - name: Install Linux system dependencies for native modules
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies from lockfile
        run: yarn install --frozen-lockfile

      - name: Resolve Electron build metadata
        shell: bash
        run: node scripts/resolve-electron-build-metadata.mjs --github-env "$GITHUB_ENV"

      - name: Build embedding worker
        shell: bash
        run: node node_modules/vite/bin/vite.js build --config vite.localEmbeddingWorker.config.mjs

      - name: Build embedding and voice runtimes
        shell: bash
        run: |
          set -euo pipefail
          for rt in embedding-xenova voice-sherpa; do
            node scripts/build-local-ai-runtime.mjs \
              --runtime "$rt" --runtime-version "$RUNTIME_VERSION" \
              --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" \
              --electron-version "$ELECTRON_VERSION" --node-module-abi "$ELECTRON_MODULE_ABI" \
              --output out/local-ai-runtimes \
              --worker-output dist/childprocess \
              --commit "${{ github.sha }}" --workflow-run-id "${{ github.run_id }}"
          done

      - name: Verify runtime archives
        shell: bash
        run: |
          set -euo pipefail
          for f in out/local-ai-runtimes/*.zip; do
            base="$(basename "$f" .zip)"
            plat="$(echo "$base" | awk -F- '{print $3}')"
            arch="$(echo "$base" | awk -F- '{print $4}')"
            node scripts/verify-local-ai-runtime.mjs \
              --archive "$f" --platform "$plat" --arch "$arch" \
              --electron-version "$ELECTRON_VERSION" --node-module-abi "$ELECTRON_MODULE_ABI"
          done

      - name: Upload runtime archives
        uses: actions/upload-artifact@v7
        with:
          name: local-ai-runtimes-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            out/local-ai-runtimes/*.zip
            out/local-ai-runtimes/*.metadata.json
          if-no-files-found: error

  generate-runtime-catalog:
    name: Generate runtime catalog
    needs: [should-rebuild, build-local-ai-runtimes]
    if: ${{ needs.should-rebuild.outputs.rebuild == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUNTIME_VERSION: ${{ needs.should-rebuild.outputs.runtime_version }}
      MIN_APP_VERSION: ${{ needs.should-rebuild.outputs.min_app_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set reproducible catalog timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Download runtime archives
        uses: actions/download-artifact@v8
        with:
          pattern: local-ai-runtimes-*
          path: runtime-assets
          merge-multiple: true

      - name: Generate runtime catalog
        shell: bash
        run: |
          node scripts/generate-local-ai-runtime-catalog.mjs \
            --input runtime-assets \
            --release-tag "${{ needs.should-rebuild.outputs.release_tag }}" \
            --repository "${{ github.repository }}" \
            --runtime-version "$RUNTIME_VERSION" \
            --min-app-version "$MIN_APP_VERSION" \
            --output runtime-assets/local-ai-runtimes.json

      - name: Write runtime fingerprint
        env:
          OVERRIDE_RELEASE_TAG: ${{ needs.should-rebuild.outputs.release_tag }}
          OVERRIDE_RUNTIME_VERSION: ${{ needs.should-rebuild.outputs.runtime_version }}
          OVERRIDE_MIN_APP_VERSION: ${{ needs.should-rebuild.outputs.min_app_version }}
        run: |
          node scripts/should-rebuild-local-ai-runtime.mjs \
            --skip-compare \
            --write-fingerprint runtime-assets/runtime-fingerprint.json

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: local-ai-runtime-release-assets
          path: runtime-assets
          if-no-files-found: error

  publish-runtime-release:
    name: Publish runtime GitHub Release
    if: ${{ needs.should-rebuild.outputs.rebuild == 'true' && (github.event_name == 'push' || github.event.inputs.publish_github_release == 'true') }}
    needs: [should-rebuild, generate-runtime-catalog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: local-ai-runtime-release-assets
          path: runtime-assets

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.should-rebuild.outputs.release_tag }}
          RELEASE_TARGET: ${{ github.sha }}
          RUNTIME_VERSION: ${{ needs.should-rebuild.outputs.runtime_version }}
          MIN_APP_VERSION: ${{ needs.should-rebuild.outputs.min_app_version }}
        run: |
          set -euo pipefail
          release_title="Local AI Runtime ${RUNTIME_VERSION}"
          release_notes="Local AI runtime assets for runtime version ${RUNTIME_VERSION}. Minimum app version: ${MIN_APP_VERSION}."

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$release_title" --notes "$release_notes"
          else
            gh release create "$RELEASE_TAG" --target "$RELEASE_TARGET" --title "$release_title" --notes "$release_notes"
          fi

          gh release upload "$RELEASE_TAG" runtime-assets/* --clobber
