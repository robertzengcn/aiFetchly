name: Manual Release Build

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build test installers or signed production installers
        required: true
        default: test
        type: choice
        options:
          - test
          - production

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      BUILD_MODE: ${{ github.event_name == 'push' && 'production' || inputs.build_mode }}
      VITE_LOGIN_URL_TEST: ${{ secrets.VITE_LOGIN_URL_TEST }}
      VITE_LOGIN_URL_PROD: ${{ secrets.VITE_LOGIN_URL_PROD }}
      UPDATESERVER_TEST: ${{ secrets.UPDATESERVER }}
      UPDATESERVER_PROD: ${{ secrets.UPDATESERVER_PROD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Set up Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Calculate version
        id: calculate_version
        shell: bash
        run: |
          set -euo pipefail
          current_version="$(node -e "console.log(require('./package.json').version)")"
          new_version="${current_version%.*}.${{ github.run_number }}"
          node -e "const pkg = require('./package.json'); pkg.version = '$new_version'; require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2))"
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "artifact_name=electron-app-windows-${BUILD_MODE}-v${new_version}" >> "$GITHUB_OUTPUT"

      - name: Write build environment
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BUILD_MODE" = "production" ]; then
            node_env="production"
            login_url="$VITE_LOGIN_URL_PROD"
            update_server="$UPDATESERVER_PROD"
          else
            node_env="test"
            login_url="$VITE_LOGIN_URL_TEST"
            update_server="$UPDATESERVER_TEST"
          fi
          if [ -z "$login_url" ]; then
            echo "::error::The login URL secret for ${BUILD_MODE} builds is empty."
            exit 1
          fi
          if [ -z "$update_server" ]; then
            echo "::error::The update-server secret for ${BUILD_MODE} builds is empty."
            exit 1
          fi
          {
            echo "NODE_ENV=$node_env"
            echo "VITE_LOGIN_URL=$login_url"
            echo "UPDATESERVER=$update_server"
          } > .env
          cp .env ".env.${node_env}"

      - name: Install dependencies from lockfile
        run: yarn install --frozen-lockfile

      - name: Rebuild better-sqlite3 for Electron
        shell: bash
        run: |
          set -euo pipefail
          npm install --global node-gyp@latest
          electron_version="$(node -p "require('./node_modules/electron/package.json').version")"
          cd node_modules/better-sqlite3
          node-gyp rebuild --release \
            --runtime=electron \
            --target="$electron_version" \
            --dist-url=https://electronjs.org/headers
          cd ../..
          yarn rebuild-better-sqlite


      - name: Install WiX Toolset
        shell: pwsh
        run: |
          $wixDirectory = "$env:ProgramFiles\WiX Toolset"
          Invoke-WebRequest -Uri https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip -OutFile wix.zip
          Expand-Archive -Path wix.zip -DestinationPath $wixDirectory
          Remove-Item -Force wix.zip
          "WIX=$wixDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $wixDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Restore Windows signing certificate
        if: ${{ env.BUILD_MODE == 'production' }}
        shell: bash
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$WINDOWS_CERTIFICATE_BASE64" ] || [ -z "$CERTIFICATE_PASSWORD" ]; then
            echo "::error::Production builds require WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD."
            exit 1
          fi
          printf '%s' "$WINDOWS_CERTIFICATE_BASE64" | base64 --decode > cert.pfx

      - name: Build application
        shell: bash
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--max-old-space-size=4096"
          if [ "$BUILD_MODE" = "production" ]; then
            yarn make-win:prod
          else
            yarn make-win:test
          fi

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.calculate_version.outputs.artifact_name }}
          path: |
            out/make/**/*.exe
            out/make/**/*.msi
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    env:
      BUILD_MODE: ${{ github.event_name == 'push' && 'production' || inputs.build_mode }}
      VITE_LOGIN_URL_TEST: ${{ secrets.VITE_LOGIN_URL_TEST }}
      VITE_LOGIN_URL_PROD: ${{ secrets.VITE_LOGIN_URL_PROD }}
      UPDATESERVER_TEST: ${{ secrets.UPDATESERVER }}
      UPDATESERVER_PROD: ${{ secrets.UPDATESERVER_PROD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up native build environment
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          if [ "$arch" = "arm64" ]; then
            target_arch="arm64"
            arch_flags="-arch arm64"
            homebrew_prefix="/opt/homebrew"
          else
            target_arch="x64"
            arch_flags="-arch x86_64"
            homebrew_prefix="/usr/local"
          fi
          {
            echo "TARGET_ARCH=$target_arch"
            echo "ARCH_FLAGS=$arch_flags"
            echo "HOMEBREW_PREFIX=$homebrew_prefix"
            echo "CXX=clang++"
            echo "CC=clang"
            echo "CXXFLAGS=-std=c++20 $arch_flags"
            echo "CFLAGS=-std=c11 $arch_flags"
            echo "LDFLAGS=-std=c++20 $arch_flags -L${homebrew_prefix}/lib"
            echo "CPPFLAGS=-I${homebrew_prefix}/include"
            echo "npm_config_target_platform=darwin"
            echo "npm_config_arch=$target_arch"
            echo "npm_config_target_arch=$target_arch"
            echo "PKG_CONFIG_PATH=${homebrew_prefix}/lib/pkgconfig"
            echo "LIBLZMA_CFLAGS=-I${homebrew_prefix}/include"
            echo "LIBLZMA_LIBS=-L${homebrew_prefix}/lib -llzma"
          } >> "$GITHUB_ENV"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Set up Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Calculate version
        id: calculate_version
        shell: bash
        run: |
          set -euo pipefail
          current_version="$(node -e "console.log(require('./package.json').version)")"
          new_version="${current_version%.*}.${{ github.run_number }}"
          node -e "const pkg = require('./package.json'); pkg.version = '$new_version'; require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2))"
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "artifact_name=electron-app-macos-${BUILD_MODE}-v${new_version}" >> "$GITHUB_OUTPUT"

      - name: Write build environment
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BUILD_MODE" = "production" ]; then
            node_env="production"
            login_url="$VITE_LOGIN_URL_PROD"
            update_server="$UPDATESERVER_PROD"
          else
            node_env="test"
            login_url="$VITE_LOGIN_URL_TEST"
            update_server="$UPDATESERVER_TEST"
          fi
          if [ -z "$login_url" ]; then
            echo "::error::The login URL secret for ${BUILD_MODE} builds is empty."
            exit 1
          fi
          if [ -z "$update_server" ]; then
            echo "::error::The update-server secret for ${BUILD_MODE} builds is empty."
            exit 1
          fi
          {
            echo "NODE_ENV=$node_env"
            echo "VITE_LOGIN_URL=$login_url"
            echo "UPDATESERVER=$update_server"
          } > .env
          cp .env ".env.${node_env}"

      - name: Install native build dependencies
        run: brew install python-setuptools xz pkg-config

      - name: Install dependencies from lockfile
        run: yarn install --frozen-lockfile

      - name: Rebuild native modules for Electron
        shell: bash
        run: |
          set -euo pipefail
          electron_version="$(node -p "require('./node_modules/electron/package.json').version")"
          CXXFLAGS="-std=c++20 ${ARCH_FLAGS}" CFLAGS="-std=c11 ${ARCH_FLAGS}" yarn rebuild-better-sqlite
          npm rebuild bufferutil --build-from-source \
            --runtime=electron \
            --target="$electron_version" \
            --arch="$TARGET_ARCH" \
            --disturl=https://electronjs.org/headers
          npm rebuild utf-8-validate --build-from-source \
            --runtime=electron \
            --target="$electron_version" \
            --arch="$TARGET_ARCH" \
            --disturl=https://electronjs.org/headers

      - name: Configure macOS signing keychain
        if: ${{ env.BUILD_MODE == 'production' }}
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Production builds require the $name secret."
              exit 1
            fi
          done
          certificate_path="$RUNNER_TEMP/aifetchly-signing.p12"
          keychain_path="$RUNNER_TEMP/aifetchly-build.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          echo "MACOS_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Build application
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--max-old-space-size=4096"
          if [ "$BUILD_MODE" = "production" ]; then
            yarn make-mac:prod
          else
            yarn make-mac:test
          fi

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.calculate_version.outputs.artifact_name }}
          path: |
            out/make/**/*.dmg
            out/make/**/*.zip
          if-no-files-found: error

      - name: Remove macOS signing keychain
        if: ${{ always() && env.BUILD_MODE == 'production' }}
        shell: bash
        run: |
          if [ -n "${MACOS_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$MACOS_KEYCHAIN_PATH" || true
          fi
