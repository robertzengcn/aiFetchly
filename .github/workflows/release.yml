name: Auto Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.calculate_version.outputs.version }}
      artifact_name: ${{ steps.calculate_version.outputs.artifact_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      # Python 3.12+ removed distutils; bundled node-gyp in electron-rebuild still imports it.
      - name: Set up Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Calculate version
        id: calculate_version
        run: |
          # Extract current version from package.json
          CURRENT_VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "Current version: $CURRENT_VERSION"
          
          # Generate build number based on GitHub run number
          BUILD_NUMBER=${{ github.run_number }}
          
          # Create new version with build number
          NEW_VERSION="${CURRENT_VERSION%.*}.$BUILD_NUMBER"
          echo "New version: $NEW_VERSION"
          
          # Update package.json with new version
          node -e "const pkg = require('./package.json'); pkg.version = '$NEW_VERSION'; require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2))"
          
          # Set as output variables
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "artifact_name=electron-app-windows-v$NEW_VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Write .env for test build
        shell: bash
        env:
          VITE_LOGIN_URL_TEST: ${{ secrets.VITE_LOGIN_URL_TEST }}
          UPDATESERVER: ${{ secrets.UPDATESERVER }}
        run: |
          set -euo pipefail
          if [ -z "$VITE_LOGIN_URL_TEST" ]; then
            echo "::error::secrets.VITE_LOGIN_URL_TEST is empty. Add it in repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$UPDATESERVER" ]; then
            echo "::error::secrets.UPDATESERVER is empty. Add it in repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          {
            echo "NODE_ENV=test"
            echo "VITE_LOGIN_URL=$VITE_LOGIN_URL_TEST"
            echo "UPDATESERVER=$UPDATESERVER"
          } > .env
          cp .env .env.test
          echo "OK: .env and .env.test written"

      - name: Install dependencies
        run: yarn install

      - name: Rebuild electron
        run: yarn electron-rebuild --force --types prod,dev,optional --module-dir .

      - name: Rebuild sqlite3 (no-op; sqlite3 unused)
        run: echo "rebuild-sqlite3 removed; sqlite3 package is unused. Skipping."

      - name: Rebuild better sqlite
        run: yarn rebuild-better-sqlite

      - name: Install WiX Toolset
        run: |
          Invoke-WebRequest -Uri https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip -OutFile wix.zip
          Expand-Archive -Path wix.zip -DestinationPath "$env:ProgramFiles\WiX Toolset"
          Remove-Item -Force wix.zip
        shell: pwsh

      - name: Build application
        run: yarn make-win:test

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.calculate_version.outputs.artifact_name }}
          path: out/make

  build-macos:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.calculate_version.outputs.version }}
      artifact_name: ${{ steps.calculate_version.outputs.artifact_name }}

    steps:
      - name: Set up C++20 environment
        run: |
          ARCH="$(uname -m)"
          echo "Detected host architecture: ${ARCH}"
          if [ "$ARCH" = "arm64" ]; then
            TARGET_ARCH="arm64"
            ARCH_FLAGS="-arch arm64"
            HOMEBREW_PREFIX="/opt/homebrew"
          else
            TARGET_ARCH="x86_64"
            ARCH_FLAGS="-arch x86_64"
            HOMEBREW_PREFIX="/usr/local"
          fi
          echo "Using target architecture: ${TARGET_ARCH}"
          echo "ARCH_FLAGS=${ARCH_FLAGS}" >> $GITHUB_ENV
          echo "TARGET_ARCH=${TARGET_ARCH}" >> $GITHUB_ENV
          echo "HOMEBREW_PREFIX=${HOMEBREW_PREFIX}" >> $GITHUB_ENV
          echo "CXXFLAGS=-std=c++20 ${ARCH_FLAGS}" >> $GITHUB_ENV
          echo "CFLAGS=-std=c11 ${ARCH_FLAGS}" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "LDFLAGS=-std=c++20 ${ARCH_FLAGS}" >> $GITHUB_ENV

      - name: Select available Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      # Python 3.12+ removed distutils; bundled node-gyp in electron-rebuild still imports it.
      - name: Set up Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Calculate version
        id: calculate_version
        run: |
          # Extract current version from package.json
          CURRENT_VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "Current version: $CURRENT_VERSION"

          # Generate build number based on GitHub run number
          BUILD_NUMBER=${{ github.run_number }}

          # Create new version with build number
          NEW_VERSION="${CURRENT_VERSION%.*}.$BUILD_NUMBER"
          echo "New version: $NEW_VERSION"

          # Update package.json with new version
          node -e "const pkg = require('./package.json'); pkg.version = '$NEW_VERSION'; require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2))"

          # Set as output variables
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "artifact_name=electron-app-macos-v$NEW_VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Write .env for test build
        shell: bash
        env:
          VITE_LOGIN_URL_TEST: ${{ secrets.VITE_LOGIN_URL_TEST }}
          UPDATESERVER: ${{ secrets.UPDATESERVER }}
        run: |
          set -euo pipefail
          if [ -z "$VITE_LOGIN_URL_TEST" ]; then
            echo "::error::secrets.VITE_LOGIN_URL_TEST is empty. Add it in repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$UPDATESERVER" ]; then
            echo "::error::secrets.UPDATESERVER is empty. Add it in repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          {
            echo "NODE_ENV=test"
            echo "VITE_LOGIN_URL=$VITE_LOGIN_URL_TEST"
            echo "UPDATESERVER=$UPDATESERVER"
          } > .env
          cp .env .env.test
          echo "OK: .env and .env.test written"

      - name: Install setuptools
        run: brew install python-setuptools

      - name: Install system dependencies for native modules
        run: brew install xz pkg-config

      - name: Install dependencies
        run: yarn install

      - name: Rebuild native modules with C++20
        run: |
          # Ensure C++20 is used for all native module builds
          export CFLAGS="-std=c11 ${ARCH_FLAGS}"
          export CXXFLAGS="-std=c++20 ${ARCH_FLAGS}"
          export LDFLAGS="-std=c++20 ${ARCH_FLAGS}"
          export npm_config_target="35.7.5"
          export npm_config_disturl="https://electronjs.org/headers"

          # Rebuild with proper C++20 support
          npx electron-rebuild --force --arch="${TARGET_ARCH}" --types prod,dev,optional --module-dir . || {
            echo "Full rebuild failed, trying selective rebuild..."
            npx electron-rebuild --force --arch="${TARGET_ARCH}" -w better-sqlite3,sqlite3,bufferutil,utf-8-validate || echo "Selective rebuild failed"
          }

      - name: Rebuild sqlite3 (no-op; sqlite3 unused)
        run: echo "rebuild-sqlite3 removed; sqlite3 package is unused. Skipping."

      - name: Rebuild better sqlite
        run: CXXFLAGS="-std=c++20" CFLAGS="-std=c11" yarn rebuild-better-sqlite

      - name: Build application
        run: |
          # Increase Node.js heap size to prevent out-of-memory errors during build
          export NODE_OPTIONS="--max-old-space-size=4096"
          echo "Building with increased heap size (4GB)"
          yarn make-mac:test

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.calculate_version.outputs.artifact_name }}
          path: out/make

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-windows.outputs.artifact_name }}
          path: ./windows-build

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-macos.outputs.artifact_name }}
          path: ./macos-build

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          while IFS= read -r -d '' file; do
            case "$file" in
              windows-build/*)
                relative_path="${file#windows-build/}"
                output_name="windows-${relative_path//\//-}"
                ;;
              macos-build/*)
                relative_path="${file#macos-build/}"
                output_name="macos-${relative_path//\//-}"
                ;;
              *)
                echo "Skipping unexpected artifact path: $file"
                continue
                ;;
            esac

            cp "$file" "release-assets/$output_name"
          done < <(find windows-build macos-build -type f -print0)

          echo "Release assets:"
          find release-assets -maxdepth 1 -type f -print | sort
          asset_count="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [ "$asset_count" = "0" ]; then
            echo "::error::No release assets were prepared."
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-windows.outputs.version }}
          name: aiFetchly v${{ needs.build-windows.outputs.version }}
          body: |
            Automated release for `${{ github.ref_name }}`.

            Commit: ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: release-assets/*
