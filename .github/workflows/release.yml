name: Release

# Builds Windows x64, macOS arm64, and macOS x64 distributables on every push,
# and publishes a DRAFT GitHub Release (with all auto-update assets) when a
# `v*` tag is pushed. Draft releases stay invisible to update.electronjs.org
# until a release engineer inspects and publishes them manually.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

# contents: write is required to create GitHub Releases and upload assets.
permissions:
  contents: write

jobs:
  # Single source of truth for the release version + tag. Both platform jobs
  # and the publish job consume this output so every artifact targets the same
  # version. The version comes from the committed package.json (PRD FR-8.1).
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is-release: ${{ steps.version.outputs.is-release }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version and tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            is_release=true
          else
            is_release=false
          fi
          # On a tag push, the pushed tag MUST match the committed package.json
          # version. Otherwise a stale tag could target an already-published
          # release (e.g. tag v1.0.12 pushed while package.json still says 1.0.11).
          if [[ "$is_release" == "true" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "ERROR: pushed tag '$GITHUB_REF_NAME' != package.json version '$tag'."
            echo "Bump package.json to $version before tagging $tag."
            exit 1
          fi
          echo "is-release=${is_release}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${version} tag=${tag} is-release=${is_release} from ${GITHUB_REF}"

  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        # Native-arch runners so native module rebuilds never cross-compile.
        # macos-14 is arm64; macos-13 is x64.
        include:
          - os: windows-2022
            platform: win32
            arch: x64
            make-script: make-win:prod
          - os: macos-14
            platform: darwin
            arch: arm64
            make-script: make-mac:prod
          - os: macos-13
            platform: darwin
            arch: x64
            make-script: make-mac:prod
    runs-on: ${{ matrix.os }}
    # forge.config.js only signs macOS when all Apple secrets are present, and
    # only signs Windows when cert.pfx + CERTIFICATE_PASSWORD are present.
    env:
      OSX_SIGN_IDENTITY: ${{ secrets.OSX_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.3
          cache: yarn

      # Python 3.12+ removed distutils; bundled node-gyp in electron-rebuild still imports it.
      - name: Set up Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up C++20 environment (macOS)
        if: matrix.platform == 'darwin'
        run: |
          ARCH="$(uname -m)"
          if [ "$ARCH" = "arm64" ]; then
            ARCH_FLAGS="-arch arm64"
            HOMEBREW_PREFIX="/opt/homebrew"
          else
            ARCH_FLAGS="-arch x86_64"
            HOMEBREW_PREFIX="/usr/local"
          fi
          echo "Detected host architecture: ${ARCH}"
          echo "ARCH_FLAGS=${ARCH_FLAGS}" >> "$GITHUB_ENV"
          echo "HOMEBREW_PREFIX=${HOMEBREW_PREFIX}" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-std=c++20 ${ARCH_FLAGS}" >> "$GITHUB_ENV"
          echo "CFLAGS=-std=c11 ${ARCH_FLAGS}" >> "$GITHUB_ENV"
          echo "LDFLAGS=-std=c++20 ${ARCH_FLAGS}" >> "$GITHUB_ENV"

      - name: Select Xcode (macOS)
        if: matrix.platform == 'darwin'
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true

      - name: Install macOS native build dependencies
        if: matrix.platform == 'darwin'
        run: brew install python-setuptools xz pkg-config

      - name: Install WiX Toolset (Windows)
        if: matrix.platform == 'win32'
        run: |
          Invoke-WebRequest -Uri https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip -OutFile wix.zip
          Expand-Archive -Path wix.zip -DestinationPath "$env:ProgramFiles\WiX Toolset"
          Remove-Item -Force wix.zip
        shell: pwsh

      # The GitHub updater source is compiled into the main-process service
      # (src/main-process/updater/AppUpdateService.ts). There is no UPDATESERVER.
      - name: Create .env
        run: |
          touch .env
          echo "NODE_ENV=production" >> .env
          echo "VITE_LOGIN_URL=${{ secrets.VITE_LOGIN_URL_PROD || secrets.VITE_LOGIN_URL_TEST }}" >> .env

      - name: Decode Windows signing certificate
        if: matrix.platform == 'win32'
        env:
          CERTIFICATE_PFX_B64: ${{ secrets.CERTIFICATE_PFX_B64 }}
        run: |
          if [ -n "$CERTIFICATE_PFX_B64" ]; then
            printf '%s' "$CERTIFICATE_PFX_B64" | base64 -d > cert.pfx
            echo "Decoded cert.pfx for signing"
          else
            echo "No CERTIFICATE_PFX_B64 secret; Windows build will be unsigned"
          fi

      - name: Install dependencies (locked)
        run: yarn install --frozen-lockfile

      - name: Rebuild native modules (Windows)
        if: matrix.platform == 'win32'
        run: |
          yarn electron-rebuild --force --types prod,dev,optional --module-dir .
          yarn rebuild-sqlite3
          yarn rebuild-better-sqlite

      - name: Rebuild native modules (macOS)
        if: matrix.platform == 'darwin'
        run: |
          export CFLAGS="-std=c11 ${ARCH_FLAGS}"
          export CXXFLAGS="-std=c++20 ${ARCH_FLAGS}"
          export LDFLAGS="-std=c++20 ${ARCH_FLAGS}"
          export npm_config_target="35.7.5"
          export npm_config_disturl="https://electronjs.org/headers"
          npx electron-rebuild --force --arch="${{ matrix.arch }}" --types prod,dev,optional --module-dir . || {
            echo "Full rebuild failed, trying selective rebuild..."
            npx electron-rebuild --force --arch="${{ matrix.arch }}" -w better-sqlite3,sqlite3,bufferutil,utf-8-validate || echo "Selective rebuild failed"
          }
          CXXFLAGS="-std=c++20" CFLAGS="-std=c11" yarn rebuild-sqlite3
          CXXFLAGS="-std=c++20" CFLAGS="-std=c11" yarn rebuild-better-sqlite

      - name: Build application
        run: yarn ${{ matrix.make-script }}
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # Fail closed if required auto-update artifacts are missing (PRD FR-6.7/7.7).
      # Tag releases also enforce macOS signing/notarization via --strict-signing.
      - name: Validate auto-update artifacts
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ needs.prepare-release.outputs.is-release }}" = "true" ] && [ "${{ matrix.platform }}" = "darwin" ]; then
            EXTRA="--strict-signing"
          fi
          node scripts/validate-update-artifacts.js \
            --platform ${{ matrix.platform }} \
            --arch ${{ matrix.arch }} \
            --root out/make \
            $EXTRA

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/make

  # Publishes a DRAFT GitHub Release containing every artifact required for
  # auto-update (RELEASES, *.nupkg, *.exe, *.zip, *.dmg). Runs only on tag push.
  publish-release:
    needs: [prepare-release, build]
    if: needs.prepare-release.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft GitHub Release with auto-update assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # Collect every auto-update distributable across platforms/arches.
          find artifacts -type f \( \
            -name 'RELEASES' -o \
            -name '*.nupkg' -o \
            -name '*.exe' -o \
            -name '*.zip' -o \
            -name '*.dmg' \
          \) -exec cp {} release-assets/ \;
          echo "Collected release assets:"
          ls -la release-assets
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG" --json isDraft -q .isDraft -R "$GITHUB_REPOSITORY")"
            if [[ "$is_draft" != "true" ]]; then
              echo "ERROR: release $TAG already exists and is PUBLISHED. Refusing to clobber a live release."
              echo "To republish, delete or redraft the release first."
              exit 1
            fi
            echo "Release $TAG exists as a draft; uploading assets (--clobber)."
            gh release upload "$TAG" release-assets/* -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release-assets/* \
              -R "$GITHUB_REPOSITORY" \
              --draft \
              --title "AiFetchly $VERSION" \
              --generate-notes
          fi
          echo "Draft release $TAG created with auto-update assets."
          echo "Publish it manually after inspection — draft releases are invisible to update.electronjs.org."
