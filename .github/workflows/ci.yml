name: CI

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: yarn

      # Python 3.12+ can break older node-gyp dependency chains used by native modules.
      - name: Set up Python for node-gyp
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Configure node-gyp Python
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$(python -c 'import sys; print(sys.executable)')"
          echo "Using Python for node-gyp: ${PYTHON_BIN}"
          python --version
          echo "PYTHON=${PYTHON_BIN}" >> "$GITHUB_ENV"
          echo "npm_config_python=${PYTHON_BIN}" >> "$GITHUB_ENV"
          echo "NODE_GYP_FORCE_PYTHON=${PYTHON_BIN}" >> "$GITHUB_ENV"

      - name: Install Linux system dependencies for native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev

      - name: Use HTTPS for GitHub dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run lint
        run: yarn lint

      - name: Rebuild native modules for Node test runtime
        run: |
          unset npm_config_runtime npm_config_target npm_config_disturl npm_config_arch
          npm rebuild better-sqlite3 --build-from-source

      - name: Run module unit tests
        run: yarn test

      - name: Run main process unit tests
        run: yarn testmain

      - name: Run utility code unit tests
        run: yarn vitest --config vite.utilityCode.ci.config.mjs --run

      - name: Verify Electron native module compatibility
        run: yarn rebuild-better-sqlite

      - name: Run native module compatibility tests
        run: yarn vitest --config vite.utilityCode.config.mjs --run test/vitest/utilitycode/nativeModuleVersion.test.ts

      - name: Run task code unit tests
        run: yarn vitest --config vite.taskCode.config.mjs --run --passWithNoTests

      - name: Restore Electron native module compatibility
        if: always()
        run: yarn rebuild-better-sqlite

  package-smoke:
    name: Package smoke test
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Isolated job + swap: ASAR finalization peaks above 7 GB on ubuntu-latest.
      NODE_OPTIONS: --max-old-space-size=4096
      ELECTRON_FORGE_VITE_CONCURRENT: "1"
      VITE_CONFIG_NATIVE_IGNORE_WARNING: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: yarn

      - name: Set up Python for node-gyp
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Configure node-gyp Python
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$(python -c 'import sys; print(sys.executable)')"
          echo "PYTHON=${PYTHON_BIN}" >> "$GITHUB_ENV"
          echo "npm_config_python=${PYTHON_BIN}" >> "$GITHUB_ENV"
          echo "NODE_GYP_FORCE_PYTHON=${PYTHON_BIN}" >> "$GITHUB_ENV"

      - name: Install Linux system dependencies for native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev

      - name: Use HTTPS for GitHub dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Add swap for electron-forge packaging
        run: |
          set -euo pipefail
          if [ ! -f /swapfile ]; then
            sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
          fi
          sudo swapon /swapfile || true
          free -h

      - name: Build Linux package for worker smoke test
        timeout-minutes: 75
        run: yarn package

      - name: Resolve packaged worker dependencies
        run: yarn verify-packaged-childprocess
