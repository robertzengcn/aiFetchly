name: CI

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: yarn

      # Python 3.12+ can break older node-gyp dependency chains used by native modules.
      - name: Set up Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run lint
        run: yarn lint

      - name: Run module unit tests
        run: yarn test

      - name: Run main process unit tests
        run: yarn testmain

      - name: Run utility code unit tests
        run: yarn vitest --config vite.utilityCode.config.mjs

      - name: Run task code unit tests
        run: yarn vitest --config vite.taskCode.config.mjs
