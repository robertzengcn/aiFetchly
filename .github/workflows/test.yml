name: Test Suite

# WS-2: the CI test gate. The green vitest main suite (+ tsc type-check gate)
# is the BLOCKING gate; the mocha integration suite is non-blocking until its
# DB/network-dependent tests are hardened. Fires on every push/PR to the active
# dev branches (packaging lives in build.yml on the `test` branch).
on:
  push:
    branches: [dev, master, test]
  pull_request:
    branches: [dev, master, test]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # undici@8 requires Node >=22.19.0; keep aligned with build.yml / ci.yml
          # and with package.json engines (node >=22.0.0). The old 20.19.3 pin
          # made `yarn install --frozen-lockfile` abort with EENGINE.
          node-version: 22.19.0

      # Native modules (better-sqlite3, sqlite-vec, isolated-vm) need a C/C++
      # toolchain + cmake to build from source on Linux.
      - name: Install build toolchain for native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 build-essential cmake

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run vitest suite + type-check gate (BLOCKING)
        # The vitest main suite (IPC, service, modules, ...) is green and runs
        # the tsc --noEmit gate first via globalSetup (do NOT set
        # AIFETCHLY_SKIP_TSC in CI). This is the HARD gate — a PR that breaks a
        # test or introduces a type error fails CI. (WS-2 R2.3 / R2.5)
        run: yarn testmain

      - name: Run mocha integration suite (non-blocking)
        # mocha tests under test/modules include DB/network-dependent cases not
        # yet hardened; keep non-blocking until they are quarantined or mocked.
        continue-on-error: true
        run: yarn test

      # NOTE: coverage artifact upload is intentionally omitted —
      # `yarn testmain --coverage` hangs on the full suite (coverage
      # instrumentation interacts with some test). Re-enable coverage in CI once
      # root-caused (WS-2 R2.4 follow-up). Per-file coverage still works via
      # `yarn testmain run <file> --coverage`.

  # ---------------------------------------------------------------------------
  # Windows shell verification matrix (natural-language-skill-installation
  # PRD §16.4 / §26.3): runs the process-provider diagnostic matrix on a REAL
  # Windows runner — PowerShell sentinel/UTF-8/unicode/stderr+exit, cmd echo,
  # native Git, timeout tree-kill, the PROCESS_OUTPUT_EMPTY_UNEXPECTED
  # sentinel, and paths with spaces. This is the release gate for the
  # observed "exit 0 with empty captured output" defect.
  # ---------------------------------------------------------------------------
  windows-shell-matrix:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: yarn

      # Python 3.12+ removed distutils; bundled node-gyp still imports it.
      # Pin 3.11 so native-module install scripts succeed (same as build.yml).
      - name: Set up Python for node-gyp
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Configure node-gyp Python
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$(python -c 'import sys; print(sys.executable)')"
          echo "npm_config_python=${PYTHON_BIN}" >> "$GITHUB_ENV"
          echo "NODE_GYP_FORCE_PYTHON=${PYTHON_BIN}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Windows process-provider diagnostic matrix (BLOCKING)
        # The vitest globalSetup runs the tsc --noEmit gate first; the
        # provider test then executes the live PowerShell/cmd/Git matrix.
        run: npx vitest run --config vite.main.config.mjs test/vitest/main/process/PlatformProcessProvider.test.ts
